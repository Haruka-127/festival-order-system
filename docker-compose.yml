services:
  app:
    build: .
    image: festival-order-system
    container_name: festival-order-system
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      NODE_ENV: "production"
      HOST: "0.0.0.0"
      PORT: "3000"
      DATA_DIR: "/app/data"
      BASE_URL: "${BASE_URL:?Set BASE_URL to the public HTTPS URL}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set a strong initial administrator password}"
      DISPLAY_NUMBER_DIGITS: "${DISPLAY_NUMBER_DIGITS:-3}"
      APP_TIME_ZONE: "${APP_TIME_ZONE:-Asia/Tokyo}"
      BACKUP_RETENTION_COUNT: "${BACKUP_RETENTION_COUNT:-20}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      ALLOW_INSECURE_HTTP: "${ALLOW_INSECURE_HTTP:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
    volumes:
      - festival-order-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/health/ready');if(!r.ok)process.exit(1)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  festival-order-data:
