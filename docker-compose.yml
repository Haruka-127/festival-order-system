services:
  app:
    build: .
    image: festival-order-system
    container_name: festival-order-system
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: "production"
      HOST: "0.0.0.0"
      PORT: "3000"
      DATA_DIR: "/app/data"
      BASE_URL: "${BASE_URL:-http://localhost:3000}"
      SESSION_SECRET: "${SESSION_SECRET:-your-secure-secret-here}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-your-admin-password}"
      DISPLAY_NUMBER_DIGITS: "${DISPLAY_NUMBER_DIGITS:-3}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
